{% extends "notes/base.html" %}

{% block title %}{{ note.title }} - Sticky Notes{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title">{{ note.title }}</h1>
                <p class="text-muted small">
                    Created: {{ note.created_at|date:"M d, Y H:i" }} | 
                    Updated: {{ note.updated_at|date:"M d, Y H:i" }}
                </p>
                <hr>
                <p class="card-text" style="white-space: pre-wrap;">{{ note.content }}</p>
            </div>
            <div class="card-footer bg-light">
                <a href="{% url 'notes:list' %}" class="btn btn-secondary">Back</a>
                <a href="{% url 'notes:edit' note.pk %}" class="btn btn-warning">Edit</a>
                <form method="POST" action="{% url 'notes:delete' note.pk %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
